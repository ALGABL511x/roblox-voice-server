<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>VoiceBlox</title>
    <style>
        body { background: #f3f4f6; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #fff; width: 300px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; }
        .btn { border: none; width: 120px; height: 120px; border-radius: 50%; cursor: pointer; font-size: 18px; transition: 0.3s; }
        .off { background: #2563eb; color: white; }
        .on { background: #dc2626; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h3 id="status">المايك مغلق</h3>
        <button id="micBtn" class="btn off" onclick="toggleMic()">🎙️</button>
    </div>
    <audio id="remoteAudio" autoplay></audio>

    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <script>
        const socket = io();
        const userId = new URLSearchParams(window.location.search).get('userId');
        let localStream = null;
        let peerConnection = null;

        if (userId) socket.emit('join-room', userId);

        async function toggleMic() {
            const btn = document.getElementById('micBtn');
            if (!localStream) {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                btn.className = "btn on";
                document.getElementById('status').innerText = "المايك مفتوح (يسمعونك)";
                // هنا يتم ربط الصوت بالشبكة
            } else {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                btn.className = "btn off";
                document.getElementById('status').innerText = "المايك مغلق";
            }
        }
    </script>
</body>
</html>
